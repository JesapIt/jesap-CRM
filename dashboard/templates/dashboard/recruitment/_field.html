<div class="form-group{% if full %} form-group--full{% endif %}{% if field.field.widget.input_type == 'checkbox' %} check{% endif %}">
  {% if field.field.widget.input_type == 'checkbox' %}
    <label>{{ field }} {{ field.label }}</label>
  {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} *{% endif %}</label>
    {{ field }}
  {% endif %}
  {% if field.errors %}<div class="field-error">{{ field.errors|join:' ' }}</div>{% endif %}
  {% if field.help_text %}<div class="field-help">{{ field.help_text }}</div>{% endif %}
</div>
