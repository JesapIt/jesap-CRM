<style>
  .form-container { max-width: 960px; margin: 24px auto; padding: 0 20px; }
  .form-card { background: #fff; padding: 28px 32px; border-radius: 12px; box-shadow: var(--shadow); border: 2px solid var(--soft-line); margin-bottom: 20px; }
  .form-section__title { font-size: 15px; font-weight: 700; color: var(--brand); text-transform: uppercase; letter-spacing: 0.5px; margin: 0 0 16px 0; }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
  .form-group--full { grid-column: 1 / -1; }
  .form-group label { display: block; font-size: 14px; font-weight: 600; color: var(--ink); margin-bottom: 6px; }
  .form-group .form-control { width: 100%; height: 42px; border-radius: 8px; border: 2px solid var(--soft-line); padding: 0 14px; font-size: 15px; font-family: inherit; color: var(--ink); background: #fff; outline: none; box-sizing: border-box; }
  .form-group textarea.form-control { height: auto; min-height: 90px; padding: 10px 14px; resize: vertical; }
  .form-group .form-control:focus { border-color: var(--brand); box-shadow: 0 0 0 4px rgba(138, 59, 134, 0.1); }
  .form-group.check label { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .field-error { color: #b91c1c; font-size: 13px; margin-top: 6px; }
  .field-help { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .form-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px; flex-wrap: wrap; }
  .btn-primary, .btn-action, .btn-danger { height: 42px; padding: 0 20px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; border: 2px solid var(--soft-line); display: inline-flex; align-items: center; justify-content: center; text-decoration: none; font-family: inherit; }
  .form-container .btn-primary { background: var(--brand); color: #fff; border-color: var(--brand); }
  .form-container .btn-primary:hover { background: var(--brand-ink); }
  .form-container .btn-action { background: #fff; color: var(--brand); }
  .form-container .btn-danger { background: #fff; color: #dc2626; border-color: #fca5a5; }
  .form-container .btn-danger:hover { background: #fef2f2; }
  .messages { list-style: none; padding: 0; margin: 0 0 16px; }
  .messages li { padding: 10px 14px; border-radius: 6px; margin-bottom: 8px; font-size: 14px; font-weight: 500; }
  .messages li.error { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }
  .messages li.success { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
  .messages li.warning, .messages li.info { background: #FEF9C3; color: #854D0E; border: 1px solid #FDE047; }
  .back-link { display: inline-block; margin-bottom: 14px; color: var(--brand); font-weight: 600; text-decoration: none; }
  .kv { display: grid; grid-template-columns: 190px 1fr; gap: 6px 16px; font-size: 14px; }
  .kv dt { color: var(--muted); font-weight: 600; }
  .kv dd { margin: 0; color: var(--ink); word-break: break-word; }
  .kv.pre dd { white-space: pre-line; }
  .mini-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .mini-table th, .mini-table td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #F1F5F9; vertical-align: top; }
  .mini-table th { font-size: 11px; text-transform: uppercase; color: #64748B; background: #F8FAFC; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: 12px; font-weight: 700; background: rgba(138, 59, 134, 0.1); color: var(--brand-ink); }
  .ok { color: #15803D; font-weight: 700; } .ko { color: #B91C1C; font-weight: 700; }
</style>
